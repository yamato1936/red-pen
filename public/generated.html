<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Sketch: Ball, Water, Ripples, Mouse-Follow Character</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f7f5ef;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hint {
    position: fixed;
    left: 14px;
    top: 10px;
    color: rgba(60,60,60,0.72);
    font-size: 13px;
    letter-spacing: 0.02em;
    user-select: none;
    pointer-events: none;
    transform: rotate(-1.2deg);
  }
</style>
</head>
<body>
<div class="hint">move mouse</div>
<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let w = 0, h = 0, dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let time = 0;

  const mouse = {
    x: 0,
    y: 0,
    active: false
  };

  const ball = {
    x: 0,
    y: 0,
    r: 0,
    vy: 0,
    startX: 0,
    startY: 0,
    inWater: false,
    settled: false,
    settleY: 0
  };

  const character = {
    x: 0,
    y: 0,
    tx: 0,
    ty: 0,
    r: 0
  };

  let water = {
    x1: 0,
    x2: 0,
    y: 0
  };

  let ripples = [];

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    water.x1 = w * 0.12;
    water.x2 = w * 0.52;
    water.y = h * 0.73;

    ball.r = Math.max(10, Math.min(w, h) * 0.018);
    ball.startX = w * 0.225;
    ball.startY = h * 0.16;
    ball.x = ball.startX;
    ball.y = ball.startY;
    ball.vy = Math.max(0.22, h * 0.00023);
    ball.inWater = false;
    ball.settled = false;
    ball.settleY = water.y + ball.r * 0.35;

    character.r = Math.max(24, Math.min(w, h) * 0.033);
    character.x = w * 0.145;
    character.y = h * 0.46;
    character.tx = character.x;
    character.ty = character.y;

    if (!mouse.active) {
      mouse.x = w * 0.7;
      mouse.y = h * 0.35;
    }

    ripples = [];
  }

  function jitter(v) {
    return (Math.random() - 0.5) * v;
  }

  function sketchLine(x1, y1, x2, y2, passes = 2, spread = 1.0) {
    for (let i = 0; i < passes; i++) {
      ctx.beginPath();
      ctx.moveTo(x1 + jitter(spread), y1 + jitter(spread));
      const mx = (x1 + x2) / 2 + jitter(spread * 2);
      const my = (y1 + y2) / 2 + jitter(spread * 2);
      ctx.quadraticCurveTo(mx, my, x2 + jitter(spread), y2 + jitter(spread));
      ctx.stroke();
    }
  }

  function sketchCircle(x, y, r, passes = 2, spread = 1.2) {
    for (let i = 0; i < passes; i++) {
      ctx.beginPath();
      ctx.ellipse(
        x + jitter(spread * 0.5),
        y + jitter(spread * 0.5),
        r + jitter(spread * 0.4),
        r * (0.98 + jitter(0.03)),
        jitter(0.08),
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }
  }

  function drawText(txt, x, y, size = 15, rot = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = 'rgba(70,70,70,0.88)';
    ctx.font = `${size}px "Comic Sans MS", "Trebuchet MS", sans-serif`;
    ctx.fillText(txt, 0, 0);
    ctx.restore();
  }

  function spawnRipples(x, y) {
    ripples.push({
      x,
      y,
      age: 0,
      maxAge: 170,
      rings: 4
    });
  }

  function updateBall() {
    if (!ball.inWater) {
      ball.y += ball.vy;
      ball.vy += h * 0.000015;

      if (ball.y + ball.r >= water.y && ball.x > water.x1 && ball.x < water.x2) {
        ball.inWater = true;
        ball.y = water.y - ball.r * 0.12;
        spawnRipples(ball.x, water.y + 2);
      }
    } else if (!ball.settled) {
      ball.y += 0.18;
      if (ball.y >= ball.settleY) {
        ball.y = ball.settleY;
        ball.settled = true;
      }
    }
  }

  function updateCharacter() {
    character.tx = mouse.x;
    character.ty = mouse.y;

    const dx = character.tx - character.x;
    const dy = character.ty - character.y;
    const dist = Math.hypot(dx, dy);
    const speed = Math.max(1.2, Math.min(4.4, Math.min(w, h) * 0.0048));

    if (dist > 1) {
      character.x += (dx / dist) * Math.min(speed, dist) * 0.55;
      character.y += (dy / dist) * Math.min(speed, dist) * 0.55;
    }

    character.x = Math.max(character.r + 8, Math.min(w - character.r - 8, character.x));
    character.y = Math.max(character.r + 8, Math.min(h - character.r - 8, character.y));
  }

  function updateRipples() {
    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].age++;
      if (ripples[i].age > ripples[i].maxAge) ripples.splice(i, 1);
    }
  }

  function drawPaperNoise() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.018)';
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.restore();
  }

  function drawWater() {
    ctx.save();
    ctx.strokeStyle = 'rgba(85,85,85,0.88)';
    ctx.lineWidth = 1.2;
    sketchLine(water.x1, water.y, water.x2, water.y, 3, 0.9);

    ctx.strokeStyle = 'rgba(120,120,120,0.18)';
    for (let i = 1; i <= 3; i++) {
      sketchLine(
        water.x1 + i * 3,
        water.y + i * 3,
        water.x2 - i * 2,
        water.y + i * 3 + Math.sin(time * 0.01 + i) * 0.4,
        1,
        0.5
      );
    }

    drawText('WATER', water.x1 + 18, water.y + 28, 14, -0.05);
    ctx.restore();
  }

  function drawBall() {
    ctx.save();
    ctx.strokeStyle = 'rgba(65,65,65,0.92)';
    ctx.lineWidth = 1.5;
    sketchCircle(ball.x, ball.y, ball.r, 3, 0.9);
    drawText('BALL', ball.x - ball.r * 0.8, ball.y + ball.r + 22, 14, -0.03);
    ctx.restore();
  }

  function drawCharacter() {
    const r = character.r;
    const dx = mouse.x - character.x;
    const dy = mouse.y - character.y;
    const ang = Math.atan2(dy, dx);

    ctx.save();
    ctx.strokeStyle = 'rgba(65,65,65,0.92)';
    ctx.lineWidth = 1.4;

    sketchCircle(character.x, character.y, r, 3, 1.1);

    const ex = Math.cos(ang) * r * 0.18;
    const ey = Math.sin(ang) * r * 0.18;

    sketchCircle(character.x - r * 0.28 + ex, character.y - r * 0.12 + ey, Math.max(2.5, r * 0.08), 2, 0.35);
    sketchCircle(character.x + r * 0.28 + ex, character.y - r * 0.12 + ey, Math.max(2.5, r * 0.08), 2, 0.35);

    ctx.beginPath();
    ctx.arc(character.x, character.y + r * 0.08, r * 0.34, 0.18 * Math.PI, 0.82 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(character.x + 0.5, character.y + r * 0.09, r * 0.33, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();

    drawText('CHARACTER', character.x - r * 1.2, character.y + r + 26, 13, -0.04);
    ctx.restore();
  }

  function drawRipples() {
    ctx.save();
    ctx.strokeStyle = 'rgba(90,90,90,0.7)';
    ctx.lineWidth = 1.1;

    ripples.forEach(rp => {
      const t = rp.age / rp.maxAge;
      const alpha = 1 - t;

      for (let i = 0; i < rp.rings; i++) {
        const rr = 14 + i * 14 + rp.age * (0.62 + i * 0.02);
        const ry = rr * 0.33;

        ctx.strokeStyle = `rgba(95,95,95,${0.22 + alpha * 0.42})`;

        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath();
          ctx.ellipse(
            rp.x + jitter(0.8),
            rp.y + jitter(0.6),
            rr + jitter(0.9),
            ry + jitter(0.6),
            jitter(0.04),
            0,
            Math.PI * 2
          );
          ctx.stroke();
        }
      }
    });

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    drawPaperNoise();
    drawWater();
    drawRipples();
    drawBall();
    drawCharacter();
  }

  function tick() {
    time++;
    updateBall();
    updateCharacter();
    updateRipples();
    draw();
    requestAnimationFrame(tick);
  }

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });

  window.addEventListener('resize', resize);

  resize();
  tick();
})();
</script>
</body>
</html>
